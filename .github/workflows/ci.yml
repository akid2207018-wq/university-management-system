name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and run all tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit, integration and database tests
        run: ./mvnw -B clean verify

      - name: Publish test report summary
        if: always()
        run: |
          echo "### Test results" >> "$GITHUB_STEP_SUMMARY"
          if [ -d target/surefire-reports ]; then
            grep -h "Tests run" target/surefire-reports/*.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No surefire reports were produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
